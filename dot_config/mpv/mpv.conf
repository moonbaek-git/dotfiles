###############################################################################
#  mpv.conf  -  full template for mpv v0.41.0-dev (Windows, shinchiro-style build)
###############################################################################
#
#  WHERE TO PUT THIS FILE (Windows)
#    Portable (recommended):  <folder with mpv.exe>\portable_config\mpv.conf
#    Per-user:                %APPDATA%\mpv\mpv.conf
#    (If a portable_config folder exists, it wins over %APPDATA%.)
#
#  SYNTAX RULES
#    - One option per line:  option=value
#    - Flags (yes/no options) can be written:  fullscreen=yes   or   fullscreen
#    - Comments start with '#' and MUST be at the start of a line.
#      Do NOT put a comment after a value (mpv would read it as part of the value).
#    - Lines below are COMMENTED OUT. Remove the leading '#' to enable one.
#    - Values shown are examples or sensible picks; defaults are noted as (default).
#    - Paths on Windows: use forward slashes or doubled backslashes,
#      e.g.  C:/Users/you/Videos   or   C:\\Users\\you\\Videos
#
#  HOW TO SEE *EVERY* OPTION YOUR BUILD SUPPORTS (this is the authoritative list)
#    mpv --list-options              all options and their defaults
#    mpv --list-options | findstr scale
#    mpv --option=help               e.g.  mpv --scale=help   (lists valid values)
#    mpv --list-properties           all runtime properties
#    mpv --input-cmdlist             all input commands (for input.conf)
#    mpv --input-keylist             all key names
#    mpv --list-protocols / --vo=help / --ao=help / --hwdec=help
#    mpv --profile=help              list profiles
#  Manual: https://mpv.io/manual/master/
#
###############################################################################


###############################################################################
# ACTIVE SETTINGS  (these are ENABLED - everything else below is commented out)
###############################################################################

# --- Tuned for HP Laptop 15-da0xxx: low-power Intel CPU, ~4 GB RAM, Intel UHD iGPU ---
# Built-in light preset: bilinear scalers, no linear-light scaling, no dithering.
# Placed FIRST so any option below can still override what the preset sets.
# (profile=high-quality is too heavy for this GPU and causes dropped frames.)
profile=fast

# Lightweight renderer + Direct3D 11 (most stable on Intel iGPUs under Windows).
# gpu-next is heavier, so stay on 'gpu' for this laptop.
vo=gpu
gpu-api=d3d11
gpu-context=d3d11

# Decode video on the GPU instead of the weak CPU. Biggest single win here.
# If you see green/garbled video, change to hwdec=auto-safe or d3d11va-copy.
hwdec=d3d11va

# Smooth playback: sync to audio, drop frames instead of stuttering, no interpolation.
video-sync=audio
interpolation=no
framedrop=vo
deband=no

# Cache: ~1.5 GB RAM is normally free, so mpv's default-sized cache is fine.
cache=yes
demuxer-max-bytes=150MiB
demuxer-max-back-bytes=75MiB
demuxer-readahead-secs=20

# Only matters if a file falls back to software decoding (e.g. AV1):
# trades a little quality for speed.
vd-lavc-fast=yes
vd-lavc-skiploopfilter=nonref

# Start every file in fullscreen.
fullscreen=yes

# Hide the mouse cursor after this many milliseconds of no movement.
# 20 ms is almost instant; use 1000 for ~1 second.
cursor-autohide=20

# Never auto-resize the window larger than 100% of the screen.
autofit-larger=100%x100%

# Starting volume and the maximum the volume keys can reach (percent).
volume=100
volume-max=130

# Subtitle look (applies to text subs like SRT; styled ASS subs keep their own style).
sub-font='Arial'
sub-font-size=30
# Slight blur on the subtitle outline for smoother edges.
sub-blur=0.2
# Outline thickness.
sub-border-size=3.0
# Text colour (white) and outline colour (black).
sub-color='#FFFFFF'
sub-border-color='#000000'

###############################################################################
# 1. GENERAL / PLAYER BEHAVIOUR
###############################################################################

# Keep the player open after the last file ends instead of quitting.
# 'always' also pauses at end of every file (good for playlists you want to stop).
#keep-open=yes
#keep-open=always

# Keep the window around even with no file loaded (needed for idle/OSC use).
#idle=yes
#force-window=yes

# Start paused.
#pause=yes

# Autoplay behaviour for playlists: yes = go to next file automatically.
#playlist-start=auto

# Loop the current file forever ("inf"), a number of times, or "no".
#loop-file=no
# Loop the whole playlist.
#loop-playlist=no

# Shuffle playlist at start.
#shuffle=yes

# Playback speed (1.0 = normal).
#speed=1.0

# Start/stop position. Examples: start=00:01:30   start=50%   end=00:10:00
#start=0
#end=none
# Only play this much of the file.
#length=none

# Remember position on quit; press Shift+Q to quit AND save position.
# Plain 'q' quits without saving.
#save-position-on-quit=yes
# Resume saved position automatically when file is opened again.
#resume-playback=yes
# Check also resume for files that have their config in watch_later.
#resume-playback-check-mtime=no
# What gets saved in watch_later files.
#watch-later-options=start,volume,mute,sub-delay,audio-delay,sid,aid,vid
# Store watch_later data here (default: portable_config\watch_later).
#watch-later-directory=~~/watch_later
# Write the real filename into watch_later files (handy for debugging).
#write-filename-in-watch-later-config=yes

# Seek behaviour: precise seeks (slower but frame-accurate) vs keyframe seeks.
#hr-seek=default
# Use precise seeking whenever possible: yes/no/absolute/always/default.
#hr-seek-framedrop=yes
# How far (secs) default left/right arrows seek is set in input.conf, not here.

# Skip to next/prev chapter behaviour when seeking back.
#chapter-seek-threshold=5.0

# Play files in the same directory automatically (autocreate playlist).
# Needs a script/Lua on older versions; enable with:
#autocreate-playlist=filter
#directory-filter-types=video,audio

# Show file loading in a clean way: ignore errors and skip to next file.
#ignore-path-in-watch-later-config=no

# Process priority on Windows: idle, belownormal, normal, abovenormal, high, realtime
#priority=normal

# Use a per-file/per-directory config: files named <video>.conf or mpv.conf in file's dir.
#use-filedir-conf=no

# Include another config file.
#include=~~/extra.conf

# Load scripts from portable_config\scripts automatically (default yes).
#load-scripts=yes
# Built-in Lua/JS scripts: stats, console, select, commands, etc.
#load-stats-overlay=yes
#load-console=yes
#load-commands=yes
#load-select=yes
#load-positioning=yes
#load-auto-profiles=auto
# Built-in on-screen controller.
#osc=yes
# Built-in youtube-dl / yt-dlp hook.
#ytdl=yes

# Per-script options (key=value,key2=value2). Better placed in script-opts\*.conf.
#script-opts=osc-layout=bottombar,osc-seekbarstyle=bar


###############################################################################
# 2. PROFILES  (named bundles of options; apply with --profile=name or auto-cond)
###############################################################################
# A profile starts with [name]. Everything under it belongs to that profile
# until the next [name]. Put profiles at the END of the file; anything above
# the first [profile] header is "global".
#
# To switch back to global, use [default].
#
# Example: profile for high quality (activate with  mpv --profile=hq  file.mkv)
#[hq]
#profile-desc="Slow, high quality scaling"
#scale=ewa_lanczossharp
#cscale=ewa_lanczossharp
#dscale=mitchell
#deband=yes
#
# Example: auto profile by file extension
#[extension.gif]
#profile-desc=gif
#loop-file=inf
#
# Example: auto profile by protocol (http, https, rtmp, smb, ...)
#[protocol.http]
#cache=yes
#demuxer-max-bytes=200MiB
#[protocol.https]
#profile=protocol.http
#
# Example: conditional profile (Lua expression using properties)
#[hdr-video]
#profile-cond=p["video-params/primaries"]=="bt.2020"
#profile-restore=copy-equal
#target-colorspace-hint=yes
#
# Example: auto profile for tiny videos
#[lowres]
#profile-cond=height<=480
#profile-restore=copy
#scale=ewa_lanczos


###############################################################################
# 3. VIDEO OUTPUT (VO) and GPU
###############################################################################

# Video output driver.
#   gpu-next = modern libplacebo renderer (RECOMMENDED, best HDR/scaling/shaders)
#   gpu      = older OpenGL/D3D11/Vulkan renderer
#   direct3d = legacy, avoid
#   null     = no video
#vo=gpu-next

# Graphics API for gpu / gpu-next:
#   d3d11  = Direct3D 11 (most compatible on Windows, default with gpu)
#   vulkan = Vulkan (best for gpu-next + HDR on many setups)
#   opengl = OpenGL
#gpu-api=d3d11
#gpu-api=vulkan

# Context (window/swapchain creation). 'auto' picks for you.
#   d3d11, winvk (vulkan on win), angle, win (opengl wgl), dxinterop
#gpu-context=auto
#gpu-context=d3d11

# Direct3D11 specific options (gpu-context=d3d11):
# Use flip-model swapchain (lower latency, needed for some HDR modes).
#d3d11-flip=yes
# Choose which GPU adapter to use (see mpv --d3d11-adapter=help).
#d3d11-adapter=
# Output colorspace of swapchain: auto, srgb, linear, pq, bt.2020 etc.
#d3d11-output-csp=auto
# Swapchain length (frames in queue).
#swapchain-depth=3
# Present with sync interval 1 (vsync) or 0 (off).
#d3d11-sync-interval=1
# Compiler flags for shaders.
#d3d11-warp=auto
#d3d11-feature-level=12_1

# Vulkan specific options (gpu-api=vulkan):
#vulkan-device=
#vulkan-swap-mode=auto
#vulkan-queue-count=1
#vulkan-async-transfer=yes
#vulkan-async-compute=yes
#vulkan-display-mode=

# Cache compiled shaders so startup is faster.
#gpu-shader-cache=yes
#gpu-shader-cache-dir=~~/cache/shaders
# Cache ICC 3DLUTs.
#icc-cache=yes
#icc-cache-dir=~~/cache/icc

# Framebuffer format used internally (higher = better quality, more VRAM).
#fbo-format=auto
# Use PBO for texture uploads (gpu-api=opengl only).
#opengl-pbo=no

# Debug the renderer.
#gpu-debug=no
#gpu-sw=no


###############################################################################
# 4. HARDWARE DECODING
###############################################################################

# hwdec options:
#   no           software decoding only (most compatible, uses CPU)
#   auto-safe    only well-tested hw decoders (RECOMMENDED SAFE DEFAULT)
#   auto         try everything (may glitch)
#   auto-copy    hw decode then copy to RAM (works with all filters/shaders)
#   d3d11va      Direct3D11 (zero-copy, good on all GPUs)
#   d3d11va-copy copy-back version of above
#   nvdec / nvdec-copy   NVIDIA CUDA decode
#   vulkan / vulkan-copy Vulkan video decode
#   dxva2 / dxva2-copy   older Windows API
#hwdec=auto-safe
#hwdec=d3d11va

# Codecs allowed to be hw decoded (default: h264,vc1,hevc,vp9,av1 ...).
# 'all' enables everything, including potentially unreliable ones.
#hwdec-codecs=all

# Number of extra surfaces for hw decode (raise if you get stutter with some drivers).
#hwdec-extra-frames=

# Auto-tune hardware decoding profile.
#hwdec-image-format=

# Threads for software decoding (0 = auto).
#vd-lavc-threads=0
# Direct rendering (less copying, faster).
#vd-lavc-dr=auto
# Skip loop filter: none, default, nonref, bidir, nonkey, all (speed vs quality).
#vd-lavc-skiploopfilter=default
# Fast decoding tricks (lowers quality slightly).
#vd-lavc-fast=no
# Apply AV1 film grain in decoder or renderer.
#vd-lavc-film-grain=gpu
# Check hw decode capability before enabling it.
#vd-lavc-check-hw-profile=yes
# Pass raw options to libavcodec.
#vd-lavc-o=


###############################################################################
# 5. VIDEO QUALITY: SCALING, DEBANDING, DITHERING
###############################################################################

# Scaling (upscaling). Quality / cost:
#   bilinear (fastest) < bicubic_fast < spline36 < lanczos < ewa_lanczos
#   < ewa_lanczossharp < ewa_lanczos4sharpest  (heaviest, best)
# 'mitchell' etc. are for downscaling. Check list:  mpv --scale=help
#scale=ewa_lanczossharp
# Chroma upscaling (color planes are lower resolution).
#cscale=ewa_lanczossharp
# Downscaling filter.
#dscale=mitchell
# Temporal scaling (for frame interpolation).
#tscale=oversample

# Downscale in linear light (more correct, needs more GPU).
#linear-downscaling=yes
# Upscale in linear light.
#linear-upscaling=no
# Sigmoid curve upscaling (reduces ringing, only for scale not ewa).
#sigmoid-upscaling=yes
# Downscale accurately (blur kernel scaled correctly).
#correct-downscaling=yes
# Reduce ringing on scalers.
#scale-antiring=0.0
#cscale-antiring=0.0
#dscale-antiring=0.0
# Blur factor for scalers (1.0 = no change; <1 sharper, >1 blurrier).
#scale-blur=
# Scaler window function and parameters.
#scale-window=
#scale-param1=
#scale-param2=
#scale-clamp=
#scale-radius=
#scale-taper=
#scale-wparam=
#scale-wblur=
#scale-wtaper=
# (every scaler 'cscale', 'dscale', 'tscale' has the same -blur, -window, -param1 ... family)

# Debanding: removes color banding in dark gradients (8-bit sources).
#deband=yes
# Number of debanding passes.
#deband-iterations=1
# Threshold: higher = more smoothing.
#deband-threshold=48
# Range of pixels to look at.
#deband-range=16
# Add grain to hide residual banding.
#deband-grain=32

# Dithering when converting to display bit depth.
#dither-depth=auto
#dither=fruit
#dither-size-fruit=6
#temporal-dither=no
#temporal-dither-period=1
#error-diffusion=

# Sharpen (simple unsharp, if not using shaders).
#sharpen=0.0

# Custom GLSL / hook shaders (.glsl). Multiple allowed, separated by ';' on Windows.
# Example: FSRCNNX, Anime4K, ravu, KrigBilateral, SSimDownscaler...
#glsl-shaders=~~/shaders/FSRCNNX_x2_16-0-4-1.glsl
#glsl-shaders-append=~~/shaders/KrigBilateral.glsl
#glsl-shader=
# Shader parameters.
#glsl-shader-opts=

# Libplacebo-specific (gpu-next) shader options.
#allow-delayed-peak-detect=no
#libplacebo-opts=

# Deinterlacing (yes / no / auto via property).
#deinterlace=no

# Fast but lower quality scaling for slow GPUs:  (replaces all above)
#profile=fast
# Highest quality preset:
#profile=high-quality


###############################################################################
# 6. FRAME TIMING, SYNC, INTERPOLATION
###############################################################################

# How video is synchronized.
#   audio           (default) video follows audio, drops/dups frames
#   display-resample resample audio to match display refresh (smoothest)
#   display-resample-vdrop etc. variants
#   desync          no sync (testing)
#video-sync=audio
#video-sync=display-resample

# Smooth motion by blending frames to display refresh (soap-opera effect on
# 24fps films, but smooth panning). Needs video-sync=display-resample.
#interpolation=yes

# Max speed adjustment in display-resample mode.
#video-sync-max-video-change=1.0
#video-sync-max-audio-change=0.125

# Override detected display refresh rate (for weird monitors / VRR).
#display-fps-override=60

# Drop frames when decoder is slow: vo, decoder, decoder+vo, no.
#framedrop=vo
# Allow dropping frames deliberately to maintain sync.
# Show only one frame / step frames.
#initial-audio-sync=yes
# Audio/video sync: positive = delay audio.
#audio-delay=0.0
# Max A/V desync before correcting.
# Fix AV desync by dropping/duplicating frames.

# Pre-render frames (queue length) to reduce stutter.
#video-latency-hacks=no


###############################################################################
# 7. COLOR MANAGEMENT, HDR, ICC
###############################################################################

# ICC profile of your display (colour accuracy on non-sRGB monitors).
#icc-profile-auto=yes
#icc-profile=C:/Windows/System32/spool/drivers/color/your.icc
#icc-force-contrast=no
#icc-intent=0
#icc-3dlut-size=64x64x64
#icc-use-luma=no
#icc-profile-auto=no

# Target display colour properties (used for tone mapping).
# Auto-detect when possible.
#target-prim=auto
#target-trc=auto
#target-peak=auto
#target-contrast=auto
#target-gamut=
#target-colorspace-hint=yes
#target-colorspace-hint-mode=target

# HDR output through Windows HDR: set if Windows HDR is ON and you want passthrough.
# Needs vo=gpu-next, gpu-api=d3d11 or vulkan, gpu-context=d3d11/winvk.
#target-colorspace-hint=yes
#d3d11-output-csp=pq

# HDR -> SDR tone mapping algorithm. Options: auto, clip, mobius, reinhard,
# hable, gamma, linear, bt.2390 (recommended), st2094-10, st2094-40 ...
#tone-mapping=bt.2390
#tone-mapping-param=
#tone-mapping-max-boost=1.0
# Dynamic peak detection per frame (better HDR -> SDR).
#hdr-compute-peak=auto
#hdr-peak-percentile=99.995
#hdr-peak-decay-rate=
#hdr-scene-threshold-low=
#hdr-scene-threshold-high=
#hdr-contrast-recovery=0.30
#hdr-contrast-smoothness=3.5
# Inverse tone mapping (SDR -> HDR) experimental.
#inverse-tone-mapping=no
# How to deal with out-of-gamut colours.
#gamut-mapping-mode=auto
#gamut-mapping=

# Treat video as given colour matrix when not flagged.
#vf-colormatrix=
#video-output-levels=auto

# Picture adjustments (-100 to 100). Can also be changed live with 1-8 keys.
#brightness=0
#contrast=0
#saturation=0
#gamma=0
#hue=0

# Gamma correction mode for sw scaler / other.
#gamma-auto=no
# Use ICC "gamma" correction for dark rooms.
#gamma-factor=1.0


###############################################################################
# 8. VIDEO GEOMETRY / ASPECT / ZOOM
###############################################################################

# Force aspect ratio: "16:9", "4:3", "2.35:1", or "-1" for default.
#video-aspect-override=-1
# Don't scale video at all (1:1 pixels).
#video-unscaled=no
# Zoom: log2 scale. 0 = normal, 1 = 2x. Changeable with keys.
#video-zoom=0
# Pan video. 0.1 moves by 10% of the width/height.
#video-pan-x=0
#video-pan-y=0
# Fill window by cropping (0 = off, 1 = full crop).
#panscan=0.0
# Rotate video by 0/90/180/270 degrees.
#video-rotate=no
# Flip image.
#vf=hflip
# Alignment of the video in the window.
#video-align-x=0
#video-align-y=0
# Aspect handling for anamorphic sources.
#video-aspect-method=bitstream
# Stretch to fill without keeping aspect (usually not wanted).
#keepaspect=yes
#keepaspect-window=yes
# Scale window to fit video's native size (1:1).
#video-scale-x=1
# Recorded display latency compensation.
# Crop with a filter: crop=w:h:x:y
#vf=crop=1920:800:0:140

# Video filters (vf). Example: denoise, sharpen, flip, scale...
#vf=
#vf-add=


###############################################################################
# 9. AUDIO
###############################################################################

# Audio output driver on Windows:
#   wasapi = default and best (shared or exclusive mode)
#   null   = no audio
#ao=wasapi

# Pick a device. List with:  mpv --audio-device=help
#audio-device=auto
#audio-device=wasapi/{xxxxxxxx-....}

# WASAPI exclusive mode: bypasses Windows mixer (bit-perfect, but other apps
# can't use the device while mpv plays).
#audio-exclusive=no
#wasapi-exclusive=no

# Default volume at startup (0-100, can go higher up to volume-max).
#volume=100
# Max volume mpv's volume control can reach (percent). 130 default.
#volume-max=130
# Extra gain in dB applied to everything.
#volume-gain=0
# Start muted.
#mute=no
# Hand volume control to the system mixer (only with ao=wasapi).
#volume-restore-data=
# Keep volume between sessions via watch-later (or use a script).

# Channel layout. 'auto-safe' keeps your speaker config, 'stereo' downmixes.
#   stereo, 5.1, 7.1, auto, auto-safe
#audio-channels=auto-safe
# Pre-set sample rate (0 = native) and format.
#audio-samplerate=0
#audio-format=
# Normalize volume when downmixing surround to stereo (stops quiet dialogue).
#audio-normalize-downmix=yes
# Use Dolby Surround matrix downmix.
#audio-swresample-o=
# Pitch correction when speed changes.
#audio-pitch-correction=yes
# Output buffer (secs). Larger = fewer glitches, more delay.
#audio-buffer=0.2
# Prefer low latency.
#audio-wait-open=0
# Which stream to play on startup (ID or 'auto'/'no').
#aid=auto
# Prefer languages (comma list, ISO 639: en,eng,jp,jpn,ja).
#alang=en,eng,jp,jpn
# Load external audio files with names matching the video.
#audio-file-auto=no
#audio-file-paths=
# Audio passthrough for AC3/DTS over HDMI/SPDIF. Needs exclusive mode usually.
#audio-spdif=ac3,dts,dts-hd,eac3,truehd
# No gap between files (for music albums).
#gapless-audio=weak
# Replay gain (music loudness normalisation): no, track, album
#replaygain=no
#replaygain-preamp=0
#replaygain-clip=no
#replaygain-fallback=0
# Play silence at end (avoids pops on some DACs).
#audio-stream-silence=no
# Name the audio client shown in Windows volume mixer.
#audio-client-name=mpv

# Audio filters (lavfi). Examples:
#   Dynamic normalizer (loud scenes quieter, quiet louder):
#af=dynaudnorm=f=150:g=15
#   EBU R128 loudness normalization:
#af=loudnorm=I=-16:TP=-1.5:LRA=11
#   Compressor (tames dynamic range):
#af=acompressor=ratio=4
#   Night mode (compress + normalise):
#af=lavfi=[dynaudnorm=f=75:g=25:n=0:p=0.58]
#   Equalizer, bass boost:
#af=equalizer=f=100:width_type=h:width=50:g=5
#af=

# Display audio cover art for music files: no / embedded-first / external-first
#audio-display=embedded-first
# Look for cover images next to audio files.
#cover-art-auto=no
#cover-art-whitelist=jpg,jpeg,png
#cover-art-files=cover,folder,front,albumart


###############################################################################
# 10. SUBTITLES
###############################################################################

# Load external subtitle files with matching names:
#   no / exact / fuzzy / all
#sub-auto=fuzzy
# Extra directories to search for subs (relative to video).
#sub-file-paths=sub:subs:subtitles
# Show subtitles at start.
#sub-visibility=yes
# Prefer subtitle languages in this order. Also: slang=en,eng,enUS
#slang=en,eng
# Prefer subs flagged "forced" only.
#sub-forced-events-only=no
# Select forced/default tracks automatically.
#subs-fallback=default
#subs-with-matching-audio=yes
# Second subtitle track (e.g., two languages at once).
#secondary-sid=auto
#secondary-sub-visibility=yes
# Which subtitle track (ID, auto, no).
#sid=auto
# Timing offset in seconds (negative = earlier).
#sub-delay=0.0
# Subtitle speed (for framerate-mismatched subs).
#sub-speed=1.0
# Try to fix timing overlaps for SRT.
#sub-fix-timing=no
# Text encoding for external subs. 'auto' uses ICU detection (utf8:cp1252 etc.)
#sub-codepage=auto
# Hide ads/SDH hearing-impaired text like [MUSIC].
#sub-filter-sdh=no
#sub-filter-sdh-harder=no
# Remove text via regex.
#sub-filter-regex-enable=no
#sub-filter-regex-plain=no
# Clear sub on seek.
#sub-clear-on-seek=no
# Show subs even after video end.
#sub-past-video-end=no
# Generate closed-caption (CEA-608) track.
#sub-create-cc-track=no

# --- Appearance (applies to text subs: SRT etc., and ASS only if overridden) ---
#sub-font=Segoe UI
#sub-font-size=55
#sub-bold=no
#sub-italic=no
# Colours are #RRGGBB or #AARRGGBB.
#sub-color=#FFFFFF
#sub-border-color=#000000
#sub-border-size=3
#sub-back-color=#00000000
#sub-shadow-color=#33000000
#sub-shadow-offset=0
#sub-blur=0
#sub-spacing=0
#sub-scale=1.0
#sub-gauss=0.0
#sub-gray=no
#sub-hinting=none
# Position: 0 = top, 100 = bottom (default 100).
sub-pos=102
#sub-margin-x=25
#sub-margin-y=22
#sub-align-x=center
#sub-align-y=bottom
#sub-justify=auto
#sub-line-spacing=0
#sub-use-margins=no
#sub-scale-by-window=yes
#sub-scale-with-window=no
# Make subtitles follow video scaling (stops them shrinking with window).

# --- ASS/SSA (styled anime subs) ---
#   no     = use as authored (default)
#   yes    = apply style overrides
#   force  = override everything (ignore authored style)
#   scale  = scale only
#   strip  = remove styling
#sub-ass-override=no
#sub-ass-style-overrides=
#sub-ass-force-margins=no
#sub-ass-vsfilter-aspect-compat=yes
#sub-ass-vsfilter-blur-compat=yes
#sub-ass-vsfilter-color-compat=basic
#sub-ass-use-video-data=none
#sub-ass-scale-border-and-shadow=yes
#sub-ass-hinting=none
#sub-ass-shaper=simple
#sub-ass=yes
# Use fonts embedded in MKV files.
#embeddedfonts=yes
# Where to find fonts for ASS (default: system + portable_config\fonts).
#sub-fonts-dir=~~/fonts

# Blend subs into the video before scaling (affects shaders; can look blurrier).
#blend-subtitles=no
# Use the video's frame for subtitle layout.


###############################################################################
# 11. ON-SCREEN DISPLAY (OSD) and OSC
###############################################################################

# Show time/seekbar when seeking: 0 = none, 1 = on seek (default), 2 = + time, 3 = + total time
#osd-level=1
# How long messages stay on screen (ms).
#osd-duration=1000
# Font and look.
#osd-font=Segoe UI
#osd-font-size=40
#osd-color=#FFFFFF
#osd-border-color=#000000
#osd-border-size=3
#osd-shadow-offset=0
#osd-back-color=#00000000
#osd-bold=no
#osd-italic=no
#osd-spacing=0
#osd-blur=0
#osd-margin-x=25
#osd-margin-y=22
#osd-align-x=left
#osd-align-y=top
#osd-scale=1
#osd-scale-by-window=yes
# Show bar in OSD when changing volume/seeking.
#osd-bar=yes
#osd-bar-align-x=0
#osd-bar-align-y=0.5
#osd-bar-w=75
#osd-bar-h=3.125
# What the percent/time shows on OSD.
#osd-fractions=no
# Text printed by OSD level 2 and 3 messages.
#osd-msg1=
#osd-msg2=
#osd-msg3=${time-pos} / ${duration}
# Status line in terminal.
#osd-status-msg=

# On-screen controller (the seekbar/buttons). Set osc=no if using uosc/modernz.
#osc=yes
# Disable built-in OSC if using a custom UI script:
#osc=no
# Disable window border (needed by uosc and some other UIs).
#border=no

# Built-in OSC options go in portable_config\script-opts\osc.conf, e.g.:
#   layout=bottombar        (box, slimbox, topbar, bottombar)
#   seekbarstyle=bar        (bar, diamond, knob)
#   hidetimeout=500
#   scalewindowed=1.0
#   scalefullscreen=1.0
#   visibility=auto         (auto, always, never)
#   showwindowed=yes
#   showfullscreen=yes

# Built-in stats overlay (press i / I). Options in script-opts\stats.conf.


###############################################################################
# 12. WINDOW BEHAVIOUR (Windows)
###############################################################################

# Fullscreen at start.
#fullscreen=yes
# Which monitor for windowed / fullscreen (0-based).
#screen=default
#fs-screen=default
# Window size/position. Examples: 50%x50%  1280x720  50%:50% (centered)  +100+100
#geometry=50%:50%
# Window size shortcut, fits video into % of screen height.
#autofit=70%x70%
# Only shrink if larger than this (never enlarge).
#autofit-larger=90%x90%
# Only enlarge if smaller than this.
#autofit-smaller=
# Automatically resize window to video size when file changes.
#auto-window-resize=yes
# Start maximized / minimized.
#window-maximized=no
#window-minimized=no
# Always on top.
#ontop=no
#ontop-level=window
# Window border (title bar and frame). 'no' for borderless.
#border=yes
#title-bar=yes
# Snap to screen edges (Windows Aero Snap behaviour).
#snap-window=no
# Allow dragging the window by clicking video.
#window-dragging=yes
# Enable drop-shadow for borderless windows.
# Window opacity (Windows 10+).
#background-color=#000000
#background=none
#force-window-position=no
# Native fullscreen (Windows uses regular fullscreen already).
#native-fs=yes
#native-touch=yes
# Show progress in Windows taskbar (green bar).
#taskbar-progress=yes
# Keep display awake while playing.
#stop-screensaver=yes
# Hide mouse cursor after N ms inactivity (-1/no = never).
#cursor-autohide=1000
#cursor-autohide-fs-only=no
# Title of the window. ${} are properties.
#title=${?media-title:${media-title}}${!media-title:No file} - mpv
# Window icon.
# Show window even when no video (audio files).
#force-window=immediate
# Window corner rounding / Windows 11 specific styling.
#window-corners=default
# Backdrop effect for Windows 11 (mica, acrylic, none).
#backdrop-type=auto
# Dark titlebar on Windows 10/11.
# Respect system dark mode.
# Remove the thin border Windows adds to the window.
# Keep window on its monitor when resizing.
#keepaspect-window=yes
# Allow window to be larger than screen.
#force-render=no
# Treat audio-only file windows as video (show cover art).
#audio-display=embedded-first


###############################################################################
# 13. CACHE, DEMUXER, NETWORK, STREAMING
###############################################################################

# Enable cache for network streams (default auto).
#cache=auto
# Also cache local files (useful on slow HDD/NAS).
#cache=yes
# Amount of data read ahead (bytes or secs).
#demuxer-max-bytes=150MiB
#demuxer-max-back-bytes=75MiB
#demuxer-readahead-secs=20
# Cache on disk instead of RAM.
#cache-on-disk=no
#cache-dir=~~/cache
# Pause when cache runs low, resume when refilled.
#cache-pause=yes
#cache-pause-wait=1
#cache-pause-initial=no
# Cache seekable data for fast backward seeks.
#demuxer-seekable-cache=auto
#demuxer-donate-buffer=yes
# Probe size / analyse duration for hard-to-open files.
#demuxer-lavf-probesize=
#demuxer-lavf-analyzeduration=
#demuxer-lavf-o=
#demuxer-lavf-format=
# Allow slow seeking in broken files.
#demuxer-mkv-subtitle-preroll=no
# Index rebuild for broken containers.
#demuxer-lavf-allow-mimetype=yes

# Network timeouts (seconds).
#network-timeout=60
# Custom headers, user agent, referrer, cookies.
#user-agent=
#referrer=
#http-header-fields=
#cookies=no
#cookies-file=
# TLS certificate checking.
#tls-verify=no
#tls-ca-file=
# Use a proxy for streams.
#http-proxy=
# Stream-level options.
#stream-buffer-size=128KiB
#stream-lavf-o=

# --- yt-dlp / youtube-dl integration ---
# mpv calls yt-dlp when you open a URL. Put yt-dlp.exe in PATH or next to mpv.exe.
#ytdl=yes
# Format selection.
#ytdl-format=bestvideo[height<=?1080]+bestaudio/best
#ytdl-format=bestvideo[height<=?2160][vcodec!=?av01]+bestaudio/best
# Pass raw args to yt-dlp (key=value,key2=value2; flags use no value).
#ytdl-raw-options=cookies-from-browser=firefox,ignore-config=
#ytdl-raw-options-append=
# Use a specific executable path via script-opts:
#script-opts=ytdl_hook-ytdl_path=C:/Tools/yt-dlp.exe
#script-opts=ytdl_hook-try_ytdl_first=yes

# Disc / special inputs
#dvd-device=
#bluray-device=
#cdda-device=
#dvdnav=
#bluray-device=D:\\


###############################################################################
# 14. SCREENSHOTS
###############################################################################

# Format: png, jpg, jpeg, webp, jxl, avif.
#screenshot-format=png
# Where to save (~ = user home, ~~ = mpv config dir, ~~desktop/ = Desktop).
#screenshot-directory=~~desktop/
#screenshot-directory=C:/Users/YourName/Pictures/mpv
# Filename template. % codes: %F filename-no-ext, %P timestamp, %n number, %p time, %tY date...
#screenshot-template=%F-%P-%n
# PNG compression 0-9, JPEG quality 0-100.
#screenshot-png-compression=7
#screenshot-png-filter=5
#screenshot-jpeg-quality=90
#screenshot-jpeg-source-chroma=yes
#screenshot-webp-lossless=no
#screenshot-webp-quality=75
#screenshot-webp-compression=4
#screenshot-avif-encoder=libaom-av1
#screenshot-avif-opts=
#screenshot-jxl-distance=1
#screenshot-jxl-effort=4
# Save 16-bit when the source is high bit-depth.
#screenshot-high-bit-depth=yes
# Embed colour space tag in file.
#screenshot-tag-colorspace=yes
# Use the video frame only, or include subtitles/OSD: 's' key (subs), 'S' (video only),
# Ctrl+s (window) are set in input.conf. This option sets the default.
#screenshot-sw=no


###############################################################################
# 15. LANGUAGE / METADATA / DEMUXER
###############################################################################

# Prefer video track by ID.
#vid=auto
# Edition (for MKV with multiple editions).
#edition=auto
# Chapters: merge, ordered chapters support.
#ordered-chapters=yes
#ordered-chapters-files=
# Prefer longest title from disc.
#bluray-playlist=
# Display metadata of all tracks in the title.
#title=
# Force a demuxer for odd files.
#demuxer=
#demuxer-thread=yes
# Don't use broken index tables.
#demuxer-lavf-hacks=yes


