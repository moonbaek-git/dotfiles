#input-cursor=yes
#input-vo-keyboard=yes
#input-builtin-bindings=yes
#input-builtin-dragging=yes
# Double-click delay (ms).
#input-doubleclick-time=300
# Key repeat rate / delay for held keys.
#input-ar-delay=200
#input-ar-rate=40
# Max key presses per second to avoid flooding.
#input-key-fifo-size=7
# Allow right-click menu & scroll-wheel behaviours via input.conf.
