#keep-open=yes
#[extension.png]
#profile=extension.jpg
#[extension.webp]
#profile=extension.jpg


###############################################################################
# 17. INPUT / KEYBOARD / MOUSE / IPC
###############################################################################

# Use mpv's built-in default key bindings (keep yes unless you want a fully custom input.conf).
#input-default-bindings=yes
# Custom bindings file. Default: portable_config\input.conf
#input-conf=~~/input.conf
# Media keys on keyboard.
#input-media-keys=yes
